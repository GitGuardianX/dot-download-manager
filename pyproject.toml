[project]
name = "dot-download-manager"
version = "0.4.4"
description = "A personal desktop download manager with validated parallel HTTP transfers"
requires-python = ">=3.11"
dependencies = []

[project.gui-scripts]
dotdm = "dotdm.__main__:main"

[tool.setuptools]
packages = ["dotdm"]
